<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg">
  <!-- Hero/card motif for the "Donostia en datos" project.
       Two abstractions of what the piece measures: left, the 19 barrios as a
       choropleth grid shaded by rental pressure; right, purchase price pulling
       away from income since 2016.

       Deliberately wordless and low-contrast. This art is composited under
       .project-hero__overlay (only 65% opaque at the top) with the page title
       laid over it, and it also sits semi-transparently behind the project
       card — any label here would be unreadable in both places and would fight
       the title in the first. Baked dark, like the other project art. -->
  <defs>
    <linearGradient id="dz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161110"/>
      <stop offset="1" stop-color="#0d0a09"/>
    </linearGradient>
    <radialGradient id="dz-glow" cx="0.78" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#eca670" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#eca670" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="440" fill="url(#dz-bg)"/>
  <rect width="1200" height="440" fill="url(#dz-glow)"/>

  <!-- ── 19 barrios, shaded by rental pressure (centre → east) ── -->
  <g fill="#eca670">
    <rect x="72"  y="96"  width="54" height="54" opacity="0.14"/>
    <rect x="134" y="96"  width="54" height="54" opacity="0.21"/>
    <rect x="196" y="96"  width="54" height="54" opacity="0.17"/>
    <rect x="258" y="96"  width="54" height="54" opacity="0.34"/>
    <rect x="320" y="96"  width="54" height="54" opacity="0.26"/>

    <rect x="72"  y="158" width="54" height="54" opacity="0.19"/>
    <rect x="134" y="158" width="54" height="54" opacity="0.29"/>
    <rect x="196" y="158" width="54" height="54" opacity="0.39"/>
    <rect x="258" y="158" width="54" height="54" opacity="0.49"/>
    <rect x="320" y="158" width="54" height="54" opacity="0.55"/>

    <rect x="72"  y="220" width="54" height="54" opacity="0.16"/>
    <rect x="134" y="220" width="54" height="54" opacity="0.24"/>
    <rect x="196" y="220" width="54" height="54" opacity="0.44"/>
    <rect x="258" y="220" width="54" height="54" opacity="0.59"/>
    <rect x="320" y="220" width="54" height="54" opacity="0.63"/>

    <rect x="72"  y="282" width="54" height="54" opacity="0.11"/>
    <rect x="134" y="282" width="54" height="54" opacity="0.21"/>
    <rect x="196" y="282" width="54" height="54" opacity="0.36"/>
    <rect x="258" y="282" width="54" height="54" opacity="0.52"/>
  </g>

  <!-- ── Purchase price vs. income, 2016 → 2025 ── -->
  <g stroke="#eca670" stroke-width="1" opacity="0.10">
    <line x1="560" y1="352" x2="1128" y2="352"/>
    <line x1="560" y1="268" x2="1128" y2="268"/>
    <line x1="560" y1="184" x2="1128" y2="184"/>
    <line x1="560" y1="100" x2="1128" y2="100"/>
  </g>
  <!-- income: broadly flat -->
  <polyline fill="none" stroke="#d3c5b8" stroke-width="2.5" opacity="0.28"
            points="560,332 623,329 686,330 749,323 812,320 875,317 938,311 1001,309 1064,305 1128,302"/>
  <!-- price: +60% since 2016 -->
  <polyline fill="none" stroke="#dd775d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.62"
            points="560,332 623,321 686,307 749,285 812,262 875,243 938,213 1001,188 1064,157 1128,132"/>
  <circle cx="1128" cy="132" r="7" fill="#eca670" opacity="0.7"/>
</svg>
