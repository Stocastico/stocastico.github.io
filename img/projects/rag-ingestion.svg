<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c63ff"/>
    </marker>
    <marker id="ahc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
  </defs>

  <rect width="800" height="280" fill="#080c14"/>

  <text x="400" y="30" text-anchor="middle" fill="#8893a4" font-size="10.5" font-weight="500" letter-spacing="0.12em">DOCUMENT INGESTION PIPELINE  ·  OFFLINE PROCESS</text>

  <!-- Box 1: SharePoint -->
  <rect x="65" y="60" width="110" height="68" rx="10" fill="#0c1020" stroke="#6c63ff" stroke-width="1.5"/>
  <text x="120" y="89" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">SharePoint</text>
  <text x="120" y="108" text-anchor="middle" fill="#8893a4" font-size="9.5">PDF document store</text>

  <line x1="175" y1="94" x2="202" y2="94" stroke="#6c63ff" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Box 2: PDF Extraction -->
  <rect x="205" y="60" width="110" height="68" rx="10" fill="#0c1020" stroke="#6c63ff" stroke-width="1.5"/>
  <text x="260" y="89" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">PDF Extraction</text>
  <text x="260" y="108" text-anchor="middle" fill="#8893a4" font-size="9.5">Parse text by page</text>

  <line x1="315" y1="94" x2="342" y2="94" stroke="#6c63ff" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Box 3: Text Chunking -->
  <rect x="345" y="60" width="110" height="68" rx="10" fill="#0c1020" stroke="#6c63ff" stroke-width="1.5"/>
  <text x="400" y="89" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Text Chunking</text>
  <text x="400" y="108" text-anchor="middle" fill="#8893a4" font-size="9.5">Split with overlap</text>

  <line x1="455" y1="94" x2="482" y2="94" stroke="#6c63ff" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Box 4: Embedding Model -->
  <rect x="485" y="60" width="110" height="68" rx="10" fill="#0c1020" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="540" y="89" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Embedding Model</text>
  <text x="540" y="108" text-anchor="middle" fill="#8893a4" font-size="9.5">Dense vectors</text>

  <line x1="595" y1="94" x2="622" y2="94" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#ahc)"/>

  <!-- Box 5: Vector Database -->
  <rect x="625" y="60" width="110" height="68" rx="10" fill="#0c1020" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="680" y="89" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Vector Database</text>
  <text x="680" y="108" text-anchor="middle" fill="#8893a4" font-size="9.5">Indexed embeddings</text>

  <!-- Metadata callout -->
  <line x1="680" y1="128" x2="680" y2="155" stroke="rgba(0,212,255,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="598" y="156" width="164" height="58" rx="8" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.25)" stroke-width="1"/>
  <text x="680" y="175" text-anchor="middle" fill="#00d4ff" font-size="9.5" font-weight="600">stored per chunk</text>
  <text x="680" y="191" text-anchor="middle" fill="#8893a4" font-size="9">filename · page number · chunk index</text>
  <text x="680" y="206" text-anchor="middle" fill="#8893a4" font-size="9">embedding vector (768–1536 dims)</text>

  <text x="400" y="256" text-anchor="middle" fill="#8893a4" font-size="10" font-style="italic">Page-level metadata is stored alongside every vector — enabling precise citations at query time</text>
</svg>
