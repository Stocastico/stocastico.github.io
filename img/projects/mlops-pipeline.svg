<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c63ff"/>
    </marker>
    <marker id="ahc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="aho" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9457"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#080c14"/>

  <text x="450" y="32" text-anchor="middle" fill="#8893a4" font-size="11" font-weight="500" letter-spacing="0.14em">VERTEX AI PIPELINE  ·  SCHEDULED RETRAINING WITH CI/CD</text>

  <!-- ── TOP ROW: PIPELINE STEPS ── -->

  <rect x="40" y="80" width="115" height="68" rx="10" fill="#0c1020" stroke="#6c63ff" stroke-width="1.5"/>
  <text x="97" y="106" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Ingest</text>
  <text x="97" y="123" text-anchor="middle" fill="#8893a4" font-size="9.5">BigQuery query</text>
  <text x="97" y="138" text-anchor="middle" fill="#8893a4" font-size="9.5">snapshot to GCS</text>

  <line x1="155" y1="114" x2="178" y2="114" stroke="#6c63ff" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="181" y="80" width="115" height="68" rx="10" fill="#0c1020" stroke="#6c63ff" stroke-width="1.5"/>
  <text x="238" y="106" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Validate</text>
  <text x="238" y="123" text-anchor="middle" fill="#8893a4" font-size="9.5">schema · stats</text>
  <text x="238" y="138" text-anchor="middle" fill="#8893a4" font-size="9.5">fail-fast checks</text>

  <line x1="296" y1="114" x2="319" y2="114" stroke="#6c63ff" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="322" y="80" width="115" height="68" rx="10" fill="#0c1020" stroke="#6c63ff" stroke-width="1.5"/>
  <text x="379" y="106" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Features</text>
  <text x="379" y="123" text-anchor="middle" fill="#8893a4" font-size="9.5">transform · join</text>
  <text x="379" y="138" text-anchor="middle" fill="#8893a4" font-size="9.5">to Feature Store</text>

  <line x1="437" y1="114" x2="460" y2="114" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#ahc)"/>

  <rect x="463" y="80" width="115" height="68" rx="10" fill="#0c1020" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="520" y="106" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Train</text>
  <text x="520" y="123" text-anchor="middle" fill="#8893a4" font-size="9.5">custom container</text>
  <text x="520" y="138" text-anchor="middle" fill="#8893a4" font-size="9.5">+ HPT if enabled</text>

  <line x1="578" y1="114" x2="601" y2="114" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#ahc)"/>

  <rect x="604" y="80" width="115" height="68" rx="10" fill="#0c1020" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="661" y="106" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Evaluate</text>
  <text x="661" y="123" text-anchor="middle" fill="#8893a4" font-size="9.5">offline metrics</text>
  <text x="661" y="138" text-anchor="middle" fill="#8893a4" font-size="9.5">vs. champion</text>

  <line x1="719" y1="114" x2="742" y2="114" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#ahc)"/>

  <rect x="745" y="80" width="115" height="68" rx="10" fill="#0c1020" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="802" y="106" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Register</text>
  <text x="802" y="123" text-anchor="middle" fill="#8893a4" font-size="9.5">Model Registry</text>
  <text x="802" y="138" text-anchor="middle" fill="#8893a4" font-size="9.5">tag candidate</text>

  <!-- Conditional gate -->
  <path d="M802,148 L802,180" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ahc)"/>

  <polygon points="745,182 860,182 802,222" fill="#0c1020" stroke="#ff9457" stroke-width="1.5"/>
  <text x="802" y="200" text-anchor="middle" fill="#e8edf8" font-size="10" font-weight="600">metrics ≥ threshold?</text>

  <!-- yes path: down to deploy -->
  <path d="M802,222 L802,256" stroke="#ff9457" stroke-width="1.5" marker-end="url(#aho)"/>
  <text x="810" y="244" fill="#ff9457" font-size="9.5" font-weight="600">yes</text>

  <rect x="745" y="260" width="115" height="68" rx="10" fill="#0c1020" stroke="#ff9457" stroke-width="1.5"/>
  <text x="802" y="286" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Deploy</text>
  <text x="802" y="303" text-anchor="middle" fill="#8893a4" font-size="9.5">canary endpoint</text>
  <text x="802" y="318" text-anchor="middle" fill="#8893a4" font-size="9.5">traffic ramp-up</text>

  <!-- no path: cycle back / alert -->
  <path d="M745,202 L680,202" stroke="#ff9457" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aho)"/>
  <text x="688" y="194" fill="#ff9457" font-size="9.5" font-weight="600">no</text>
  <rect x="560" y="180" width="120" height="46" rx="8" fill="rgba(255,148,87,0.06)" stroke="rgba(255,148,87,0.35)" stroke-width="1"/>
  <text x="620" y="200" text-anchor="middle" fill="#ff9457" font-size="10" font-weight="600">halt &amp; alert</text>
  <text x="620" y="215" text-anchor="middle" fill="#8893a4" font-size="9">Slack · PagerDuty</text>

  <!-- Deploy → Monitor -->
  <path d="M745,294 L460,294" stroke="#ff9457" stroke-width="1.5" marker-end="url(#aho)"/>

  <rect x="345" y="260" width="115" height="68" rx="10" fill="#0c1020" stroke="#ff9457" stroke-width="1.5"/>
  <text x="402" y="286" text-anchor="middle" fill="#e8edf8" font-size="11.5" font-weight="600">Monitor</text>
  <text x="402" y="303" text-anchor="middle" fill="#8893a4" font-size="9.5">drift · skew · perf</text>
  <text x="402" y="318" text-anchor="middle" fill="#8893a4" font-size="9.5">scheduled checks</text>

  <!-- Monitor → trigger retraining (back to ingest) -->
  <path d="M345,294 L100,294 L100,148" fill="none" stroke="rgba(255,148,87,0.55)" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#aho)"/>
  <text x="170" y="286" fill="#8893a4" font-size="9.5" font-style="italic">drift detected → retrain</text>

  <!-- ── BOTTOM: CI/CD trigger band ── -->
  <line x1="40" y1="362" x2="860" y2="362" stroke="rgba(232,237,248,0.12)" stroke-width="1"/>
  <text x="40" y="384" fill="#8893a4" font-size="9.5" font-weight="600" letter-spacing="0.1em">TRIGGERS</text>

  <text x="140" y="384" fill="#e8edf8" font-size="10">Cloud Scheduler (cron)</text>
  <text x="280" y="384" fill="#8893a4" font-size="10">·</text>
  <text x="295" y="384" fill="#e8edf8" font-size="10">Git push → Cloud Build → pipeline submit</text>
  <text x="552" y="384" fill="#8893a4" font-size="10">·</text>
  <text x="567" y="384" fill="#e8edf8" font-size="10">Drift alert → automatic retraining run</text>

  <text x="450" y="406" text-anchor="middle" fill="#8893a4" font-size="10" font-style="italic">Each pipeline run is reproducible — parameters, code, data snapshot, and metrics are all tracked together</text>
</svg>
