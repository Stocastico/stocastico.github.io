<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">
  <defs>
    <radialGradient id="bgRad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#15224a"/>
      <stop offset="50%" stop-color="#0a0f22"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#6c63ff" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9457" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="bgGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRad)"/>

  <!-- diagonal flow lines -->
  <g filter="url(#bgGlow)" opacity="0.7">
    <path d="M-50,150 C400,100 800,260 1200,200 S1600,150 1700,180" fill="none" stroke="url(#flowGrad)" stroke-width="1.8"/>
    <path d="M-50,320 C350,280 750,420 1150,360 S1600,320 1700,340" fill="none" stroke="url(#flowGrad)" stroke-width="1.6"/>
    <path d="M-50,470 C400,520 800,400 1200,480 S1600,520 1700,500" fill="none" stroke="url(#flowGrad)" stroke-width="2"/>
    <path d="M-50,640 C350,690 750,580 1150,650 S1600,690 1700,670" fill="none" stroke="url(#flowGrad)" stroke-width="1.5"/>
    <path d="M-50,800 C400,750 800,880 1200,820 S1600,800 1700,820" fill="none" stroke="url(#flowGrad)" stroke-width="1.7"/>
  </g>

  <!-- scattered nodes -->
  <g opacity="0.5">
    <circle cx="180" cy="200" r="3" fill="#6c63ff"/>
    <circle cx="420" cy="260" r="2" fill="#6c63ff"/>
    <circle cx="640" cy="180" r="3" fill="#00d4ff"/>
    <circle cx="880" cy="240" r="2" fill="#00d4ff"/>
    <circle cx="1080" cy="200" r="3" fill="#00d4ff"/>
    <circle cx="1320" cy="180" r="2" fill="#ff9457"/>
    <circle cx="220" cy="430" r="2" fill="#6c63ff"/>
    <circle cx="500" cy="470" r="3" fill="#00d4ff"/>
    <circle cx="780" cy="420" r="2" fill="#00d4ff"/>
    <circle cx="1020" cy="490" r="3" fill="#ff9457"/>
    <circle cx="1280" cy="450" r="2" fill="#ff9457"/>
    <circle cx="320" cy="680" r="3" fill="#6c63ff"/>
    <circle cx="600" cy="640" r="2" fill="#00d4ff"/>
    <circle cx="900" cy="700" r="3" fill="#ff9457"/>
    <circle cx="1180" cy="660" r="2" fill="#ff9457"/>
  </g>

  <!-- centre lifecycle ring -->
  <g transform="translate(800 450)" opacity="0.92">
    <circle r="230" fill="none" stroke="rgba(108,99,255,0.18)" stroke-width="34"/>
    <circle r="230" fill="none" stroke="rgba(0,212,255,0.55)" stroke-width="2.2" stroke-dasharray="16,8"/>

    <!-- 6 nodes -->
    <g font-size="13" font-weight="600" font-family="Inter,system-ui,sans-serif">
      <circle cx="0" cy="-230" r="28" fill="#0c1020" stroke="#6c63ff" stroke-width="2"/>
      <text x="0" y="-226" text-anchor="middle" fill="#e8edf8">DATA</text>

      <circle cx="199" cy="-115" r="28" fill="#0c1020" stroke="#6c63ff" stroke-width="2"/>
      <text x="199" y="-111" text-anchor="middle" fill="#e8edf8" font-size="11">VALIDATE</text>

      <circle cx="199" cy="115" r="28" fill="#0c1020" stroke="#00d4ff" stroke-width="2"/>
      <text x="199" y="119" text-anchor="middle" fill="#e8edf8">TRAIN</text>

      <circle cx="0" cy="230" r="28" fill="#0c1020" stroke="#00d4ff" stroke-width="2"/>
      <text x="0" y="234" text-anchor="middle" fill="#e8edf8" font-size="11">REGISTER</text>

      <circle cx="-199" cy="115" r="28" fill="#0c1020" stroke="#ff9457" stroke-width="2"/>
      <text x="-199" y="119" text-anchor="middle" fill="#e8edf8">DEPLOY</text>

      <circle cx="-199" cy="-115" r="28" fill="#0c1020" stroke="#ff9457" stroke-width="2"/>
      <text x="-199" y="-111" text-anchor="middle" fill="#e8edf8" font-size="11">MONITOR</text>
    </g>
  </g>

  <!-- vignette -->
  <rect width="1600" height="900" fill="url(#vignette)" opacity="0.45"/>
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.7)"/>
  </radialGradient>
</svg>
