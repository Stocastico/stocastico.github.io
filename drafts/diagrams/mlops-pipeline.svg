<svg class="diagram" role="img" width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">
  <title>Pipeline flow chart. Six steps run left to right: Ingest (a BigQuery query writing a snapshot to GCS), Validate (schema, statistics, fail-fast), Features (transform, join, Feature Store), Train (custom container, hyperparameter tuning), Evaluate (offline metrics against the current champion) and Register (Model Registry, tag candidate). A decision node then asks whether the metrics clear the threshold: No halts the run and alerts Slack and PagerDuty; Yes deploys to a canary endpoint with traffic ramp-up. Monitoring for drift, skew and scheduled checks feeds back to Ingest as an automatic retraining trigger. Triggers listed underneath: Cloud Scheduler on cron, a Git push through Cloud Build to a pipeline submission, and a drift alert starting a retraining run.</title>
  <defs>
    <marker id="mp-a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="var(--accent)"/>
    </marker>
    <marker id="mp-b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="var(--accent2)"/>
    </marker>
    <marker id="mp-m" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="var(--text-muted)"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="var(--bg-alt)"/>

  <!-- ── The six pipeline steps ─────────────────────────────── -->
  <rect x="24" y="34" width="140" height="76" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="94" y="62" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">Ingest</text>
  <text x="94" y="81" text-anchor="middle" fill="var(--text-muted)" font-size="10">BigQuery query ·</text>
  <text x="94" y="96" text-anchor="middle" fill="var(--text-muted)" font-size="10">snapshot to GCS</text>

  <line x1="168" y1="72" x2="188" y2="72" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#mp-a)"/>

  <rect x="192" y="34" width="140" height="76" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="262" y="62" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">Validate</text>
  <text x="262" y="81" text-anchor="middle" fill="var(--text-muted)" font-size="10">schema · stats</text>
  <text x="262" y="96" text-anchor="middle" fill="var(--text-muted)" font-size="10">· fail-fast</text>

  <line x1="336" y1="72" x2="356" y2="72" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#mp-a)"/>

  <rect x="360" y="34" width="140" height="76" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="430" y="62" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">Features</text>
  <text x="430" y="81" text-anchor="middle" fill="var(--text-muted)" font-size="10">transform · join</text>
  <text x="430" y="96" text-anchor="middle" fill="var(--text-muted)" font-size="10">· Feature Store</text>

  <line x1="504" y1="72" x2="524" y2="72" stroke="var(--accent2)" stroke-width="1.5" marker-end="url(#mp-b)"/>

  <rect x="528" y="34" width="130" height="76" rx="10" fill="var(--bg-card)" stroke="var(--accent2)" stroke-width="1.5"/>
  <text x="593" y="62" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">Train</text>
  <text x="593" y="81" text-anchor="middle" fill="var(--text-muted)" font-size="10">custom</text>
  <text x="593" y="96" text-anchor="middle" fill="var(--text-muted)" font-size="10">container · HPT</text>

  <line x1="662" y1="72" x2="682" y2="72" stroke="var(--accent2)" stroke-width="1.5" marker-end="url(#mp-b)"/>

  <rect x="686" y="34" width="132" height="76" rx="10" fill="var(--bg-card)" stroke="var(--accent2)" stroke-width="1.5"/>
  <text x="752" y="62" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">Evaluate</text>
  <text x="752" y="81" text-anchor="middle" fill="var(--text-muted)" font-size="10">offline metrics</text>
  <text x="752" y="96" text-anchor="middle" fill="var(--text-muted)" font-size="10">vs. champion</text>

  <line x1="822" y1="72" x2="842" y2="72" stroke="var(--accent2)" stroke-width="1.5" marker-end="url(#mp-b)"/>

  <rect x="846" y="34" width="90" height="76" rx="10" fill="var(--bg-card)" stroke="var(--accent2)" stroke-width="1.5"/>
  <text x="891" y="62" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">Register</text>
  <text x="891" y="81" text-anchor="middle" fill="var(--text-muted)" font-size="10">Model</text>
  <text x="891" y="96" text-anchor="middle" fill="var(--text-muted)" font-size="10">Registry</text>

  <!-- ── The gate ───────────────────────────────────────────── -->
  <path d="M891 110 V 152" fill="none" stroke="var(--accent2)" stroke-width="1.5" marker-end="url(#mp-b)"/>

  <path d="M891 164 L 954 214 L 891 264 L 828 214 Z"
        fill="var(--bg-card)" stroke="var(--text-muted)" stroke-width="1.5"/>
  <text x="891" y="209" text-anchor="middle" fill="var(--text)" font-size="11.5" font-weight="600">metrics ≥</text>
  <text x="891" y="226" text-anchor="middle" fill="var(--text)" font-size="11.5" font-weight="600">threshold?</text>

  <!-- No -> halt -->
  <path d="M828 214 H 776" fill="none" stroke="var(--accent-hi)" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#mp-a)"/>
  <text x="812" y="205" text-anchor="middle" fill="var(--accent-text)" font-size="11" font-weight="600">No</text>

  <rect x="604" y="184" width="168" height="62" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="688" y="210" text-anchor="middle" fill="var(--text)" font-size="12.5" font-weight="600">halt &amp; alert</text>
  <text x="688" y="229" text-anchor="middle" fill="var(--text-muted)" font-size="10">Slack · PagerDuty</text>

  <!-- Yes -> deploy -->
  <path d="M891 264 V 306" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#mp-a)"/>
  <text x="906" y="290" fill="var(--accent-text)" font-size="11" font-weight="600">Yes</text>

  <rect x="790" y="310" width="146" height="76" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="863" y="338" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">Deploy</text>
  <text x="863" y="357" text-anchor="middle" fill="var(--text-muted)" font-size="10">canary endpoint ·</text>
  <text x="863" y="372" text-anchor="middle" fill="var(--text-muted)" font-size="10">traffic ramp-up</text>

  <!-- Deploy -> Monitor -->
  <path d="M790 348 H 626" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#mp-a)"/>

  <rect x="446" y="310" width="176" height="76" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="534" y="338" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">Monitor</text>
  <text x="534" y="357" text-anchor="middle" fill="var(--text-muted)" font-size="10">drift · skew ·</text>
  <text x="534" y="372" text-anchor="middle" fill="var(--text-muted)" font-size="10">scheduled checks</text>

  <!-- Monitor -> back to Ingest -->
  <path d="M446 348 H 200 Q 94 348 94 240 V 116" fill="none" stroke="var(--text-muted)" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#mp-m)"/>
  <text x="228" y="286" fill="var(--text-muted)" font-size="11">drift detected → retrain</text>

  <!-- ── Triggers ───────────────────────────────────────────── -->
  <line x1="24" y1="418" x2="936" y2="418" stroke="var(--border)" stroke-width="1"/>
  <text x="24" y="446" fill="var(--text-muted)" font-size="11.5" font-weight="700" letter-spacing="0.14em">TRIGGERS</text>
  <text x="24" y="474" fill="var(--text)" font-size="12">Cloud Scheduler (cron)  ·  Git push → Cloud Build → pipeline submit</text>
  <text x="24" y="494" fill="var(--text)" font-size="12">Drift alert → automatic retraining run</text>
</svg>
