<svg class="diagram" role="img" width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">
  <title>Offline ingestion pipeline: PDFs in the SharePoint document store are parsed page by page, split into overlapping chunks, encoded by an embedding model into 768-to-1536-dimension vectors, and indexed in a vector database. Filename, page number and chunk index are stored alongside every vector, which is what makes precise citations possible at query time.</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--accent)"/>
    </marker>
    <marker id="ahc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--accent2)"/>
    </marker>
  </defs>

  <rect width="800" height="280" fill="var(--bg-alt)"/>

  <text x="400" y="30" text-anchor="middle" fill="var(--text-muted)" font-size="9.24" font-weight="500" letter-spacing="0.12em">DOCUMENT INGESTION PIPELINE  ·  OFFLINE PROCESS</text>

  <!-- Box 1: SharePoint -->
  <rect x="65" y="60" width="110" height="68" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="120" y="89" text-anchor="middle" fill="var(--text)" font-size="10.12" font-weight="600">SharePoint</text>
  <text x="120" y="108" text-anchor="middle" fill="var(--text-muted)" font-size="8.36">PDF document store</text>

  <line x1="175" y1="94" x2="202" y2="94" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Box 2: PDF Extraction -->
  <rect x="205" y="60" width="110" height="68" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="260" y="89" text-anchor="middle" fill="var(--text)" font-size="10.12" font-weight="600">PDF Extraction</text>
  <text x="260" y="108" text-anchor="middle" fill="var(--text-muted)" font-size="8.36">Parse text by page</text>

  <line x1="315" y1="94" x2="342" y2="94" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Box 3: Text Chunking -->
  <rect x="345" y="60" width="110" height="68" rx="10" fill="var(--bg-card)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="400" y="89" text-anchor="middle" fill="var(--text)" font-size="10.12" font-weight="600">Text Chunking</text>
  <text x="400" y="108" text-anchor="middle" fill="var(--text-muted)" font-size="8.36">Split with overlap</text>

  <line x1="455" y1="94" x2="482" y2="94" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Box 4: Embedding Model -->
  <rect x="485" y="60" width="110" height="68" rx="10" fill="var(--bg-card)" stroke="var(--accent2)" stroke-width="1.5"/>
  <text x="540" y="89" text-anchor="middle" fill="var(--text)" font-size="10.12" font-weight="600">Embedding Model</text>
  <text x="540" y="108" text-anchor="middle" fill="var(--text-muted)" font-size="8.36">Dense vectors</text>

  <line x1="595" y1="94" x2="622" y2="94" stroke="var(--accent2)" stroke-width="1.5" marker-end="url(#ahc)"/>

  <!-- Box 5: Vector Database -->
  <rect x="625" y="60" width="110" height="68" rx="10" fill="var(--bg-card)" stroke="var(--accent2)" stroke-width="1.5"/>
  <text x="680" y="89" text-anchor="middle" fill="var(--text)" font-size="10.12" font-weight="600">Vector Database</text>
  <text x="680" y="108" text-anchor="middle" fill="var(--text-muted)" font-size="8.36">Indexed embeddings</text>

  <!-- Metadata callout -->
  <line x1="680" y1="128" x2="680" y2="155" stroke="rgb(var(--accent2-rgb) / 0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="598" y="156" width="164" height="58" rx="8" fill="rgb(var(--accent2-rgb) / 0.06)" stroke="rgb(var(--accent2-rgb) / 0.25)" stroke-width="1"/>
  <text x="680" y="175" text-anchor="middle" fill="var(--accent2)" font-size="8.36" font-weight="600">stored per chunk</text>
  <text x="680" y="191" text-anchor="middle" fill="var(--text-muted)" font-size="7.92">filename · page number · chunk index</text>
  <text x="680" y="206" text-anchor="middle" fill="var(--text-muted)" font-size="7.92">embedding vector (768–1536 dims)</text>

  <text x="400" y="256" text-anchor="middle" fill="var(--text-muted)" font-size="8.8" font-style="italic">Page-level metadata is stored alongside every vector — enabling precise citations at query time</text>
</svg>
