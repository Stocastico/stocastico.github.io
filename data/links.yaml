# Curated links for personal site — source of truth for the links page.
# Run `npm run generate-links` after editing to rebuild data/links.js.
#
# Flat list so each entry lives in MULTIPLE categories without being repeated:
# generate-links de-duplicates by URL (merging categories/tags) and the page
# renders one card per site, filterable by category.
#   name        -> display name (required)
#   url         -> https:// only (required)
#   description -> one-line summary (optional)
#   categories  -> one or more; power the on-page category filter chips
#   tags        -> finer-grained labels (kept in the data for search/future use)
# Valid categories: ai | engineering-math-physics | visual-explanation | beautiful-websites | misc

links:
