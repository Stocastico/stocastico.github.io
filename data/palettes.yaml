# ─────────────────────────────────────────────────────────────────────────────
# THEME PALETTE — single source of truth for every colour on the site.
#
# Edit the palette then run ALL THREE of:
#
#     npm run generate-theme         # CSS/JS/HTML colour tokens
#     npm run generate-favicons      # raster icons, drawn from the palette
#     npm run generate-project-og    # the palette-driven project social cards
#     (and npm run generate-og if the site-wide social card should follow)
#
# The last two are easy to forget and each has a drift guard that fails the
# build, which is deliberate.
#
# generate-theme regenerates, in one pass:
#   • the :root colour block in css/styles.css
#   • js/theme.js                (consumed by the Canvas modules + the globe)
#   • <meta theme-color>, the inline favicon, and the nav-logo gradient
#     in every *.html file + the scripts/new-project.js template
#   • public/favicon.svg
#
# Colour formats: all values are #rrggbb hex. The generator derives the
# rgba()/0xRRGGBB/[r,g,b] forms each layer needs.
#
# ── One theme, on purpose ───────────────────────────────────────────────────
# Until the Montaggio redesign (#188) this file held four palettes, each with a
# required light variant, and the navbar carried a palette picker and a
# light/dark toggle. Both are gone. A visitor does not come to a personal site
# to configure it: the choice was a programmer's feature, it doubled every
# colour decision (eight palettes to keep legible instead of one) and it diluted
# the identity the redesign exists to establish. The light variant was also the
# weaker one — no yellow holds 3:1 on a light ground, so the colour bars turned
# olive and the hero's filter responses went muddy. One dark theme, made well.
#
# `active:` and the `palettes:` mapping stay so the schema can hold a future
# redesign side by side with this one; generate-theme rejects a `light:` key.
#
# ── On the *Text tokens ──────────────────────────────────────────────────────
# `accentText` / `accent2Text` exist because `accent` / `accent2` are brand
# colours used for gradients, borders, pins and glows, where WCAG's 3:1
# non-text floor applies — but the site also colours 10-13px metadata with them
# (years, tags, hosts), where the floor is 4.5:1.
#
# Every text token is validated by test/contrast.test.mjs against FOUR surfaces:
# bg, bgAlt, and the derived card / card-hover. Measuring only against `bg` was
# the bug — a card is `text` at 12% over `bg`, so it is lighter than the page,
# and a colour that just clears the bar on the page falls below it on a card.
# ─────────────────────────────────────────────────────────────────────────────

active: montaggio

palettes:

  montaggio:
    name: Montaggio
    # The redesign's identity (#188, #190): an editing suite. A charcoal UI
    # ground rather than near-black, and the SMPTE colour bars as the accent
    # set — yellow and cyan are the two accents (the hero's positive and
    # negative responses: two hues as far apart as the bars put them), and the
    # four pins carry the remaining bars in SMPTE order, which is how the
    # colour-bar strip at the top of every page is drawn from palette tokens
    # alone: text, accent, accent2, lived, holiday, current, worktrip.
    bg: '#202328'
    bgAlt: '#2a2e35'
    text: '#ece9e2'
    textMuted: '#d8d6d0'
    textFaint: '#d2d0ca'
    accent: '#ddd23f'
    accentHi: '#ebe36a'
    accent2: '#3fc4cd'
    accent2Hi: '#7fdbe1'
    accentText: '#e2d85a'
    accent2Text: '#6fd3da'
    onAccent: '#16181b'
    # Equal stops: the gradient-filled name and section titles are retired in
    # this palette; the CSS still reads the pair, so it paints solid.
    heroGradFrom: '#ece9e2'
    heroGradTo: '#ece9e2'
    mapBg: '#1a1c20'
    themeColor: '#202328'
    faviconBg: '#202328'
    faviconFg: '#ddd23f'
    pins:
      lived: '#5cbf54'
      current: '#e0574d'
      worktrip: '#6d8cf0'
      holiday: '#e17edc'
    # The globe is drawn as the travel chart's companion (#193): the chart's
    # sea and land, a cyan depth line hugging the coast and a pale coastline
    # over it, no yellow halo. Europe is not singled out — the chart above it
    # already is Europe.
    globe:
      ocean: '#1a1c20'
      land: '#3d4146'
      landEurope: '#3d4146'
      coast: '#3fc4cd'
      coastBright: '#c9c7c1'
      ambient: '#1d2025'
      keyLight: '#3b414b'
      rimLight: '#3fc4cd'
      fillLight: '#ddd23f'
      atmInner: '#3fc4cd'
      atmShell: '#25414a'
      atmHalo: '#202328'
      grid: '#4a6f78'
      gridBright: '#7fdbe1'
      stars: '#ece9e2'
      fallback1: '#4b6a73'
      fallback2: '#262a31'
      fallback3: '#16181c'
    # Unused since the WebGL hero went (#189); still required by the schema
    # until the cleanup in #195.
    noise:
      dark: '#202328'
      mid: '#2f3640'
      bright: '#3fc4cd'
