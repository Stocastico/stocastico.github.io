# ─────────────────────────────────────────────────────────────────────────────
# THEME PALETTES — single source of truth for every colour on the site.
#
# Edit a palette (or switch the `active` key) then run:
#
#     npm run generate-theme
#
# That regenerates, in one pass:
#   • the :root colour block in css/styles.css
#   • js/theme.js                (consumed by the WebGL/Canvas modules + shaders)
#   • <meta theme-color>, the inline favicon, and the nav-logo gradient
#     in every *.html file + the scripts/new-project.js template
#   • public/favicon.svg
#
# Colour formats: all values are #rrggbb hex. The generator derives the
# rgba()/0xRRGGBB/[r,g,b] forms each layer needs.
#
# ── On the *Text tokens ──────────────────────────────────────────────────────
# `accentText` / `accent2Text` exist because `accent` / `accent2` are brand
# colours used for gradients, borders, pins and glows, where WCAG's 3:1
# non-text floor applies — but the site also colours 10-13px metadata with them
# (years, tags, eyebrows, hosts), where the floor is 4.5:1. Darkening `accent`
# itself to satisfy the metadata would mute all 96 of its uses to fix 32.
#
# Every text token is validated by test/contrast.test.mjs against FOUR surfaces:
# bg, bgAlt, and the derived card / card-hover. Measuring only against `bg` was
# the bug — a card is `text` at 12% over `bg`, so it is lighter than the page in
# dark mode, and a colour that just clears the bar on the page falls below it on
# a card. Every one of these values was solved in OKLCH (hue and chroma held,
# lightness moved) to clear 4.5:1 on the tightest of the four.
#
# Note textMuted and textFaint now sit close together. That is the honest
# consequence of holding both to AA at metadata sizes: there is not room for
# three separately-legible text tiers. The hierarchy comes from size, weight
# and case, not from fading the colour out.
# ─────────────────────────────────────────────────────────────────────────────

