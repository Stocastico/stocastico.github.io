  <style>
    /* "No signal": the colour bars a monitor shows when there is no picture —
       the same seven palette tokens as the strip at the top of every page and
       the card frames with no thumbnail — with the slate naming what is
       missing. Left-aligned like every section header (CLAUDE.md). */
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(var(--nav-h) + 2rem) var(--gutter) 3rem;
      /* The gutter outside the content width, as on every page, so the bars
         and the title start under the logo. */
      max-width: calc(var(--container) + 2 * var(--gutter));
      margin-inline: auto;
    }

    .error-bars {
      position: relative;
      aspect-ratio: 16 / 5;
      max-height: 40vh;
      border-radius: var(--r-md);
      overflow: hidden;
      background: linear-gradient(90deg,
        var(--text) 0 14.286%, var(--accent) 0 28.571%, var(--accent2) 0 42.857%,
        var(--pin-lived) 0 57.143%, var(--pin-holiday) 0 71.429%,
        var(--pin-current) 0 85.714%, var(--pin-worktrip) 0 100%);
      margin-bottom: 2.5rem;
    }

    .error-code {
      position: absolute;
      left: 50%;
      top: 50%;
      translate: -50% -50%;
      padding: 0.35em 0.8em;
      font-family: var(--font-mono);
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 700;
      color: var(--text);
      background: var(--bg);
      border-radius: var(--r-sm);
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(2.75rem, 7.5vw, 7rem);
      font-weight: 800;
      font-stretch: 62%;
      line-height: 0.95;
      letter-spacing: var(--tracking-display);
      color: var(--text);
      margin-bottom: 1rem;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 44ch;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .error-page .btn {
      align-self: flex-start;
    }
  </style>

  <!-- Command palette — opened with ⌘K / Ctrl+K.

       A real <dialog>, opened with showModal(). That one call replaces the
       four things this used to hand-roll: the top layer (so no z-index race),
       background inert, Escape-to-close, and returning focus to whatever
       opened it. role="dialog" and aria-modal are implicit and must NOT be
       written out — an explicit aria-modal on a modal dialog is redundant at
       best. Visibility is the `open` attribute the browser manages, not
       `hidden`, which is what made the old markup able to disagree with the
       CSS. -->
  <dialog class="cmd-overlay" id="cmd-overlay" aria-label="Command palette">
    <div class="cmd-box">
      <div class="cmd-search-row">
        <svg class="cmd-search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">

          type="text" placeholder="Jump to section, open CV, copy email…"
          autocomplete="off" spellcheck="false" aria-autocomplete="list"
          aria-controls="cmd-list" aria-label="Search commands"
        />
        <kbd class="cmd-esc-hint">Esc</kbd>
      </div>
      <ul class="cmd-list" id="cmd-list" role="listbox" aria-label="Commands"></ul>
    </div>
  </dialog>
