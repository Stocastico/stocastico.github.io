<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Page Not Found</title>
  <meta name="theme-color" content="#080c14" />
  <!-- Self-hosted fonts -->
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23080c14'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' font-size='32' fill='%2300d4ff' font-family='Georgia,serif'%3ESM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      color: var(--text);
      margin-bottom: 1rem;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 440px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-desc">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn btn-primary">Back to Home</a>
  </main>
</body>

</html>
