# .github/workflows/link-check.yml
#
# Monthly advisory check on the hand-curated outbound links: the blogroll
# (data/links.yaml) and the publication URLs (data/publications.js).
#
# Deliberately NOT a pull-request gate. Two reasons, and the second is the one
# that matters:
#
#   1. Eighty-odd third-party hosts on every PR is slow and flaky.
#   2. A dead external link does not break the build — it disappoints a
#      visitor. That is a much slower clock than a merge, so the right cadence
#      is monthly and the right output is an issue somebody reads, not a red
#      mark on a branch that has nothing wrong with it.
#
# It exists because two links had rotted unnoticed: one blogroll entry pointed
# at an apex serving no certificate, another at a host that had gone away
# entirely. Roughly 4% of the blogroll in eighteen months, and it compounds.
#
# The script filters 401/403/405/429 as bot-blocking rather than breakage —
# without that, whc.unesco.org alone would file 130 false positives a month
# and the issue would stop being read by the second run. See the long note at
# the top of scripts/check-links.mjs.

name: Link check

on:
  schedule:
    # 07:00 UTC on the 1st of each month. An hour after the Monday palette
    # rotation's slot so the two never contend for a runner.
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # to file / update the advisory issue

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    name: Check curated outbound links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # No build and no browser needed: the script reads the two data files and
      # makes HTTP requests. `npm ci` is here only because it imports
      # data/publications.js as an ES module.
      - name: Install dependencies
        run: npm ci

      - name: Check links
        id: check
        run: |
          set -o pipefail
          node scripts/check-links.mjs | tee link-report.txt
          # The script always exits 0 (see its header). Decide from the report.
          if grep -q 'need attention' link-report.txt; then
            echo "dead=true" >> "$GITHUB_OUTPUT"
          else
            echo "dead=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the advisory issue
        if: steps.check.outputs.dead == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('link-report.txt', 'utf8');
            const TITLE = 'Link check: curated links need attention';
            const body = [
              'The monthly link check found links that did not respond over three attempts.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '**Before editing anything, open one in a browser.** 401/403/405/429 are already',
              'filtered out as bot-blocking, but a lone 5xx or timeout can still be the runner\'s',
              'egress rather than the site — that has produced a false positive before.',
              '',
              'Sources checked: `data/links.yaml`, `data/publications.js`.',
              'Run locally with `npm run check-links`.',
              '',
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            // Reuse the open issue rather than filing a new one every month —
            // twelve near-identical issues a year is how a report stops being read.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-rot',
            });

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
              core.info(`Commented on existing issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: ['link-rot'],
              });
              core.info(`Opened issue #${created.number}`);
            }

      - name: Report clean
        if: steps.check.outputs.dead == 'false'
        run: echo "All curated links reachable."
