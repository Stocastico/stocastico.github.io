name: Build

on:
  # Runs after a PR is merged into main (merge creates a push on main).
  push:
    branches: [main]
  # Allow manual triggering from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run the full test suite before producing any output.  A red test
      # blocks the build (and therefore the deploy) automatically.
      - name: Run tests
        run: npm test

      # Regenerate data/cv.js from data/cv.yaml.
      - name: Generate CV data
        run: npm run generate-cv

      # Regenerate data/locations.js from data/locations.yaml.
      # Geocode cache is committed to the repo (.cache/locations-geocode-cache.json)
      # so this step only queries Nominatim for genuinely new places.
      - name: Generate globe locations
        run: npm run generate-locations

      # Vite build: bundles js/main.js (with Three.js, all data files, and
      # all extracted modules) and emits a fully self-contained dist/.
      - name: Build with Vite
        run: npm run build
