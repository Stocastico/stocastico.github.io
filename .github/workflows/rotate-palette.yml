# .github/workflows/rotate-palette.yml
#
# Periodically rotate the site's colour palette and redeploy.
#
# Every Monday ~06:00 UTC this:
#   1. advances data/palettes.yaml `active` to the next palette (cycling)
#   2. regenerates the theme (CSS/JS/HTML/favicon.svg) + raster favicons
#   3. runs the test suite as a gate
#   4. commits the change back to main
#   5. builds and deploys to GitHub Pages
#
# It is self-contained on purpose: the commit is pushed with the default
# GITHUB_TOKEN, which does NOT re-trigger the `on: push` workflows
# (deploy.yml), so this job does the deploy itself — no extra
# deploy runs, no personal access token required.
#
# Run it manually from the Actions tab any time; optionally force a specific
# palette via the `palette` input.

name: Rotate palette

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — edit to change cadence
  workflow_dispatch:
    inputs:
      palette:
        description: 'Force a specific palette id (blank = cycle to next)'
        required: false
        default: ''

permissions:
  contents: write # commit + push the rotated palette to main
  pages: write
  id-token: write

# Share the "pages" concurrency group with deploy.yml so palette rotations
# and push deploys never race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rotate-and-deploy:
    name: Rotate palette and deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rotate active palette
        id: rotate
        run: node scripts/rotate-palette.js ${{ inputs.palette && format('--palette {0}', inputs.palette) || '' }}

      # generate-theme-toggle is here because it was missing here. It bakes
      # aria-pressed="true" onto the navbar dot for the active palette, and the
      # recipe everyone copied ("generate-theme, then generate-favicons")
      # predates the dots — so every rotation left all 21 pages asserting the
      # *previous* palette was the selected one. test/theme-sync.test.js now
      # fails on that drift, which means forgetting this step stops the deploy
      # at the test gate below instead of shipping.
      - name: Regenerate theme + toggle + raster favicons
        if: steps.rotate.outputs.changed == 'true'
        run: |
          npm run generate-theme
          npm run generate-theme-toggle
          npm run generate-favicons

      # Test suite gates the deploy: a red test stops the rotation here, before
      # anything is committed or published.
      - name: Run tests
        if: steps.rotate.outputs.changed == 'true'
        run: npm test

      # The browser suite gates the rotation too, exactly as it gates
      # deploy.yml. It did not, and that gap was the wrong shape: this job is
      # the *only* path by which a colour change reaches production without a
      # human, and axe-over-the-rendered-page in both themes is the only layer
      # that can see a colour problem the token-level test cannot.
      #
      # test/contrast.test.mjs (in `npm test` above) measures palette tokens
      # against the surfaces they land on, which is most of the risk. What it
      # cannot see, by construction, is contrast that only exists once the page
      # is composited — the .link-chip-count bug was `opacity: 0.7` over an
      # already-muted token, below 4.5:1 in every light palette, and invisible
      # to any test that reasons about the tokens instead of the pixels. A
      # palette rotation is precisely the change that can turn that kind of
      # latent margin negative, so it should not be the one change that skips
      # the check.
      #
      # Steps mirror e2e.yml; see the notes there for why both Chromium builds
      # and why the glob rather than a file list.
      - name: Install Chromium
        if: steps.rotate.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build for the browser tests
        if: steps.rotate.outputs.changed == 'true'
        run: npm run build

      - name: Run browser tests
        if: steps.rotate.outputs.changed == 'true'
        run: npm run test:e2e:ci

      - name: Commit rotated palette to main
        if: steps.rotate.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: rotate theme palette to ${{ steps.rotate.outputs.palette_name }} (${{ steps.rotate.outputs.palette }})"
          git push origin HEAD:main

      # ── Mirror deploy.yml's build-time refresh steps (these outputs are
      #    rebuilt for the artifact but, like deploy.yml, are not committed). ──
      - name: Regenerate sitemap
        if: steps.rotate.outputs.changed == 'true'
        run: npm run generate-sitemap

      # deploy.yml runs this and this job did not, despite the comment above
      # claiming to mirror it. Since the feed's entry dates became editorial
      # (data/projects.js `updated:`, falling back to `year`) rather than git
      # mtimes, this is a no-op on a pure palette rotation — which is the point:
      # the two deploy paths should produce the same artefact, and the one that
      # runs unattended every Monday is the wrong one to leave a step out of.
      - name: Regenerate Atom feed
        if: steps.rotate.outputs.changed == 'true'
        run: npm run generate-feed

      - name: Regenerate project JSON-LD
        if: steps.rotate.outputs.changed == 'true'
        run: npm run generate-project-jsonld

      - name: Build with Vite
        if: steps.rotate.outputs.changed == 'true'
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.rotate.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.rotate.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.rotate.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
