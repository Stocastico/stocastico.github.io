# .github/workflows/deploy.yml
#
# Build and deploy to GitHub Pages on every push to main.
#
# Setup:
#   1. Go to Settings → Pages → Source → "GitHub Actions"
#   2. Push to main — the workflow runs automatically.
#
# For a custom domain, add a CNAME file to the repo root and configure
# DNS as described in DEPLOYMENT.md.

name: Build and Deploy

on:
  # Automatic deployment on push is disabled until the site is ready to go live.
  # Re-enable by uncommenting the lines below:
  # push:
  #   branches: [main]
  workflow_dispatch: # allow manual trigger from the GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; queued runs are cancelled if a newer
# push arrives before they start.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Run the full test suite before generating any output.
      - name: Run tests
        run: npm test

      # Regenerate data/cv.js from data/cv.yaml.
      - name: Generate CV data
        run: npm run generate-cv

      # Regenerate data/locations.js from data/locations.yaml.
      # Geocode cache is committed to the repo (.cache/locations-geocode-cache.json)
      # so this step only queries Nominatim for genuinely new places.
      - name: Generate globe locations
        run: npm run generate-locations

      # Regenerate rss.xml.
      # Replace the --base-url value with your actual domain.
      - name: Generate RSS feed
        run: npm run generate-rss -- --base-url https://${{ github.repository_owner }}.github.io

      # Regenerate sitemap.xml.
      - name: Generate sitemap
        run: npm run generate-sitemap -- --base-url https://${{ github.repository_owner }}.github.io

      # Minify js/main.js → js/main.min.js.
      # The HTML must reference js/main.min.js for this to have any effect
      # on the deployed site (see DEPLOYMENT.md — Minification section).
      - name: Minify JavaScript
        run: npm run minify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      # Upload the entire repository as the Pages artifact.
      # Files listed in .gitignore are NOT excluded here — only files
      # that were never committed (e.g. node_modules) are absent.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
