# .github/workflows/deploy.yml
#
# Manual deployment to GitHub Pages.
#
# Setup:
#   1. Go to Settings -> Pages -> Source -> "GitHub Actions"
#   2. Run this workflow manually from the Actions tab.
#
# Later, to deploy automatically after a successful build workflow run,
# enable the commented workflow_run trigger below.

name: Deploy

on:
  workflow_dispatch: # allow manual trigger from the GitHub Actions UI
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; queued runs are cancelled if a newer
# push arrives before they start.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # If workflow_run is enabled, keep deployment gated on successful builds.
  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      # Upload the entire repository as the Pages artifact.
      # Files listed in .gitignore are NOT excluded here — only files
      # that were never committed (e.g. node_modules) are absent.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
