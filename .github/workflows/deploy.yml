# .github/workflows/deploy.yml
#
# Build + deploy to GitHub Pages.
#
# Setup:
#   1. Go to Settings -> Pages -> Source -> "GitHub Actions"
#   2. Either push to main, or run this workflow manually from the
#      Actions tab.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; queued runs are cancelled if a
# newer push arrives before they start.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm test` runs before the build — a red test blocks the deploy
      # automatically.
      - name: Run tests
        run: npm test

      - name: Build with Vite
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      # Upload the Vite output (dist/) as the Pages artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
