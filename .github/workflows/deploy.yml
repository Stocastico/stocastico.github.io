# .github/workflows/deploy.yml
#
# Build + deploy to GitHub Pages.
#
# Setup:
#   1. Go to Settings -> Pages -> Source -> "GitHub Actions"
#   2. Either push to main, or run this workflow manually from the
#      Actions tab.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; queued runs are cancelled if a
# newer push arrives before they start.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm test` runs before the build — a red test blocks the deploy
      # automatically.
      - name: Run tests
        run: npm test

      # The browser suite gates the deploy too. It is the only layer that can
      # see a rendered page, and every bug that reached a visitor so far was
      # invisible to the suite above: content left at opacity 0, a page torn
      # down on a bfcache freeze, a map the same colour as its background.
      # Both builds on purpose. `chromium` is the headless shell Playwright
      # uses by default; `chromium --channel=chromium` is the full browser, and
      # only that one implements the back/forward cache — the headless shell
      # cannot run the lifecycle test at all and would skip it every time.
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          npx playwright install --with-deps --channel=chromium

      - name: Build for the browser tests
        run: npm run build

      - name: Run browser tests
        run: node --test --test-concurrency=2 test/e2e/pages.e2e.mjs test/e2e/content.e2e.mjs test/e2e/interaction.e2e.mjs test/e2e/mnist.e2e.mjs

      # Regenerate sitemap.xml so <lastmod> reflects the latest commit dates.
      # The test suite already asserts the on-disk sitemap is correct; this
      # just refreshes lastmod for any pages touched in this push.
      - name: Regenerate sitemap
        run: npm run generate-sitemap

      # Re-render BreadcrumbList + Article JSON-LD on every project page.
      # Idempotent — only updates the marker block in the <head>.
      - name: Regenerate project JSON-LD
        run: npm run generate-project-jsonld

      - name: Build with Vite
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Upload the Vite output (dist/) as the Pages artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
