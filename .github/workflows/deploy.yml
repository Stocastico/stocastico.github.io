# .github/workflows/deploy.yml
#
# Build + deploy to GitHub Pages.
#
# Setup:
#   1. Go to Settings -> Pages -> Source -> "GitHub Actions"
#   2. Either push to main, or run this workflow manually from the
#      Actions tab.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; queued runs are cancelled if a
# newer push arrives before they start.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm test` runs before the build — a red test blocks the deploy
      # automatically.
      - name: Run tests
        run: npm test

      # The browser suite gates the deploy too. It is the only layer that can
      # see a rendered page, and every bug that reached a visitor so far was
      # invisible to the suite above: content left at opacity 0, a page torn
      # down on a bfcache freeze, a map the same colour as its background.
      # `install chromium` provides BOTH builds — chromium-<rev> (the full
      # browser, which `channel: 'chromium'` selects and which is the only one
      # that implements the back/forward cache) and chromium_headless_shell-<rev>
      # (Playwright's default). The lifecycle test needs the former; everything
      # else runs on the latter. One command covers both.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Which builds actually landed. The lifecycle test needs chromium-<rev>
      # (the full browser) and skips without it; printing this means a skip can
      # be diagnosed from the log instead of by guessing at the next commit.
      - name: Show installed browsers
        run: npx playwright install --dry-run chromium

      - name: Build for the browser tests
        run: npm run build

      # One glob, shared with e2e.yml and with the local `npm run test:e2e`, so
      # the deploy gate cannot quietly cover less than the developer's run does.
      # It used to name four files, which meant a11y.e2e.mjs and
      # budget.e2e.mjs had never gated a deploy — see the note in e2e.yml.
      - name: Run browser tests
        run: npm run test:e2e:ci

      # Regenerate sitemap.xml so <lastmod> reflects the latest commit dates.
      # The test suite already asserts the on-disk sitemap is correct; this
      # just refreshes lastmod for any pages touched in this push.
      - name: Regenerate sitemap
        run: npm run generate-sitemap

      # Same policy as the sitemap: entry <updated> dates come from git
      # history, so refresh them against the commits in this push.
      - name: Regenerate Atom feed
        run: npm run generate-feed

      # Re-render BreadcrumbList + Article JSON-LD on every project page.
      # Idempotent — only updates the marker block in the <head>.
      - name: Regenerate project JSON-LD
        run: npm run generate-project-jsonld

      - name: Build with Vite
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Upload the Vite output (dist/) as the Pages artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
