name: E2E

# The pull-request gate: both test layers, in that order.
#
# The browser suite is why this workflow exists. The fast suite cannot, in
# principle, catch the class of bug that reached visitors: content stuck at
# opacity 0, a page that came back dead from the back/forward cache, a map
# drawn in the same colour as its background. Each needed layout, compositing
# or the browser's own lifecycle to be observable at all — static analysis and
# DOM stubs were green throughout. It lives in its own workflow because it
# needs a real Chromium and takes a few minutes, where `npm test` stays fast
# enough to run on every save locally.
#
# `npm test` runs here as well because this is the only workflow triggered by
# `pull_request` — see the note on that step for what that cost.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The fast suite runs here too, and that is not redundancy — it is the
      # only place it runs on a pull request at all.
      #
      # `npm test` was gated exclusively on deploy.yml (and the since-deleted
      # build.yml), both of
      # which are `push: [main]`. This workflow was the sole pull_request check.
      # So a PR could sit green with all ~890 static assertions red, and the
      # first anyone heard of it was the deploy gate refusing to publish after
      # the merge. That is a safe failure — nothing broken reaches the site —
      # but it puts the signal on the wrong side of the merge button, where
      # acting on it means a revert or a follow-up commit on main instead of a
      # push to the branch.
      #
      # It sits before the Chromium install deliberately. The static suite is
      # ~2 seconds; the install is ~25 and the browser run ~5 minutes. A drift
      # check or a contrast regression should fail the job almost immediately
      # rather than after five minutes of work whose result nobody will read.
      #
      # The job keeps the name "Browser tests" so any status check configured
      # against it keeps resolving. If that name is renamed later, rename it
      # everywhere it is referenced at the same time.
      - name: Run static tests
        run: npm test

      # Only Chromium — the suite asserts behaviour (does the reveal fire, does
      # bfcache restore work), not cross-browser rendering.
      # `install chromium` provides BOTH builds — chromium-<rev> (the full
      # browser, which `channel: 'chromium'` selects and which is the only one
      # that implements the back/forward cache) and chromium_headless_shell-<rev>
      # (Playwright's default). The lifecycle test needs the former; everything
      # else runs on the latter. One command covers both.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Which builds actually landed. The lifecycle test needs chromium-<rev>
      # (the full browser) and skips without it; printing this means a skip can
      # be diagnosed from the log instead of by guessing at the next commit.
      - name: Show installed browsers
        run: npx playwright install --dry-run chromium

      # The suite serves dist/, so it tests the artefact that actually ships
      # rather than the sources.
      - name: Build site
        run: npm run build

      # `test:e2e:ci` is the same glob the local `npm run test:e2e` uses, minus
      # the build (the step above already did it). It is a glob rather than a
      # list because a list is what went wrong: this step named four files and
      # the two it did not name — a11y.e2e.mjs and budget.e2e.mjs — had
      # therefore never run in CI, despite being part of `npm run test:e2e`
      # locally and described in CLAUDE.md as deploy gates. The byte budget in
      # particular exists to catch a regression nobody would notice by eye, so
      # a budget CI never evaluates is not a budget. Adding a file to
      # test/e2e/ now enrolls it automatically, the same way the page list is
      # read from dist/.
      - name: Run browser tests
        run: npm run test:e2e:ci
